services:
  server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - TZ=Asia/Shanghai
      - GOROCKSDB_PROFILE=demo
      - GOROCKSDB_DATA=/data
      - GOROCKSDB_LISTEN=:8080
      - GOROCKSDB_CORS_ORIGINS=http://localhost:28741
    volumes:
      - gorocksdb-data:/data
    ports:
      - "28742:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "28741:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 10s
    restart: unless-stopped

  qa:
    profiles: [qa]
    image: python:3.12-alpine
    environment:
      - TZ=Asia/Shanghai
      - GOROCKSDB_SMOKE_BASE=http://web
      - PYTHONIOENCODING=utf-8
    volumes:
      - ./tests:/tests:ro
    working_dir: /tests
    depends_on:
      web:
        condition: service_healthy
    command: ["python", "api_smoke.py"]

volumes:
  gorocksdb-data:
